<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cảnh 2D Trung Thu 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050814;
            overflow: hidden;
            width: 100vw; height: 100vh;
            display: flex; justify-content: center; align-items: center;
        }

        .scene-container {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 40%, #1a2238 0%, #050814 85%);
            overflow: hidden;
        }

        /* 1. Trăng khổng lồ */
        .moon-2d {
            position: absolute;
            top: 10%; left: 50%;
            transform: translateX(-50%);
            width: 300px; height: 300px;
            background: radial-gradient(circle, #fffdf0 0%, #ffeaa7 50%, #fbc531 100%);
            border-radius: 50%;
            box-shadow: 0 0 50px rgba(251, 197, 49, 0.6), 0 0 100px rgba(255, 234, 167, 0.3);
            z-index: 1;
        }

        /* 2. Mây 2D Á Đông (Z-index 2 - đè nhẹ lên trăng) */
        .cloud-2d {
            position: absolute;
            z-index: 2;
            opacity: 0.85;
            animation: floatCloud 20s linear infinite alternate;
        }
        .cloud-1 { top: 18%; left: 20%; width: 200px; }
        .cloud-2 { top: 28%; right: 18%; width: 240px; animation-delay: -5s; }

        @keyframes floatCloud {
            0% { transform: translateX(-20px); }
            100% { transform: translateX(20px); }
        }

        /* 3. Chị Hằng Bay (Z-index 3) */
        .hang-nga-container {
            position: absolute;
            top: 15%; right: 12%;
            width: 140px; height: 140px;
            z-index: 3;
            animation: floatFairy 4s ease-in-out infinite alternate;
            filter: drop-shadow(0 0 12px rgba(255, 234, 167, 0.8));
        }

        @keyframes floatFairy {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-25px) rotate(-4deg); }
        }

        /* 4. Đồi cỏ & Cây Đa Chú Cuội (Z-index 4 - Dưới đất) */
        .ground-and-tree {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 380px;
            z-index: 4;
            pointer-events: none;
        }

        /* 5. Thỏ Ngọc trên mặt đất (Z-index 5) */
        .rabbit-container {
            position: absolute;
            bottom: 25px; left: 18%;
            width: 60px; height: 60px;
            z-index: 5;
            filter: drop-shadow(0 0 8px #fff);
            animation: rabbitIdle 1.8s ease-in-out infinite alternate;
        }

        @keyframes rabbitIdle {
            0% { transform: translateY(0) scaleY(1); }
            100% { transform: translateY(-8px) scaleY(1.05); }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <!-- Trăng -->
        <div class="moon-2d"></div>

        <!-- Mây Á Đông 2D -->
        <svg class="cloud-2d cloud-1" viewBox="0 0 200 80" fill="#ffeaa7">
            <path d="M10 50 Q30 20 60 35 Q90 10 130 30 Q170 15 190 45 Q200 65 170 70 Q130 75 80 70 Q30 75 10 50 Z" opacity="0.3"/>
            <path d="M20 55 Q40 30 70 42 Q100 20 140 38 Q170 28 185 55 Q160 65 100 62 Q50 65 20 55 Z" fill="#ffffff" opacity="0.5"/>
        </svg>

        <svg class="cloud-2d cloud-2" viewBox="0 0 200 80">
            <path d="M10 40 Q40 10 80 25 Q120 5 160 25 Q190 20 195 50 Q170 70 110 65 Q50 70 10 40 Z" fill="#ffeaa7" opacity="0.35"/>
        </svg>

        <!-- Chị Hằng 2D Vector -->
        <div class="hang-nga-container">
            <svg viewBox="0 0 100 100" width="100%" height="100%">
                <!-- Dải lụa bay -->
                <path d="M 5 60 C 20 20, 60 10, 95 30 C 70 60, 40 80, 10 85 Z" fill="#ffeaa7" opacity="0.6"/>
                <path d="M 15 70 C 35 35, 75 25, 90 40" stroke="#ff7675" stroke-width="2" fill="none"/>
                <!-- Váy & Thân -->
                <path d="M 45 45 C 55 55, 65 75, 40 90 C 35 75, 40 55, 45 45 Z" fill="#ffffff"/>
                <path d="M 42 45 C 50 35, 58 45, 48 55 Z" fill="#ff7675"/>
                <!-- Đầu & Tóc búi -->
                <circle cx="50" cy="30" r="7" fill="#ffeaa7"/>
                <circle cx="46" cy="24" r="4" fill="#2d3436"/>
                <path d="M 44 28 C 48 20, 56 22, 54 28 Z" fill="#2d3436"/>
            </svg>
        </div>

        <!-- Cảnh Đồi Cỏ + Cây Đa + Chú Cuội -->
        <div class="ground-and-tree">
            <svg viewBox="0 0 800 400" width="100%" height="100%" preserveAspectRatio="none">
                <!-- Đồi cỏ nền 2D -->
                <path d="M 0 400 Q 250 310 500 350 Q 700 380 800 330 L 800 400 Z" fill="#0d1326"/>
                <path d="M 0 400 Q 400 320 800 400 Z" fill="#090d1a"/>

                <!-- CÂY ĐA CỔ THỤ 2D -->
                <!-- Thân cây & Rễ rủ -->
                <g fill="#050814">
                    <path d="M 520 400 C 530 310, 500 240, 560 160 C 580 220, 610 280, 640 400 Z"/>
                    <!-- Cành cây vươn ra -->
                    <path d="M 545 210 C 480 180, 430 190, 380 210 C 430 225, 480 215, 540 225 Z"/>
                    <path d="M 555 180 C 580 130, 630 110, 680 100 C 640 130, 600 140, 565 190 Z"/>
                    <!-- Rễ rủ phong cách Cây Đa -->
                    <path d="M 450 200 L 452 350 L 448 350 Z" opacity="0.7"/>
                    <path d="M 480 195 L 482 360 L 479 360 Z" opacity="0.7"/>
                    <path d="M 600 125 L 602 280 L 599 280 Z" opacity="0.7"/>
                </g>

                <!-- Tán lá Cây Đa 2D xếp lớp -->
                <g fill="#0a1128">
                    <circle cx="380" cy="200" r="45"/>
                    <circle cx="440" cy="170" r="55"/>
                    <circle cx="530" cy="130" r="65"/>
                    <circle cx="610" cy="100" r="60"/>
                    <circle cx="670" cy="110" r="45"/>
                </g>
                <g fill="#0e1738">
                    <circle cx="410" cy="185" r="35"/>
                    <circle cx="510" cy="140" r="50"/>
                    <circle cx="590" cy="110" r="45"/>
                </g>

                <!-- CHÚ CUỘI NGOÌ DỰA GỐC CÂY THỔI SÁO -->
                <g transform="translate(485, 305)">
                    <!-- Thân Cuội -->
                    <path d="M 10 35 C 10 20, 25 15, 35 25 C 40 35, 30 45, 10 45 Z" fill="#ffeaa7"/>
                    <!-- Đầu & Búi tóc củ tỏi -->
                    <circle cx="20" cy="12" r="8" fill="#ffeaa7"/>
                    <circle cx="14" cy="7" r="4" fill="#ffeaa7"/> <!-- Búi tóc -->
                    <!-- Dáng chân ngồi co gối -->
                    <path d="M 25 35 C 35 30, 45 40, 40 45 C 30 45, 25 40, 25 35 Z" fill="#ffeaa7"/>
                    <!-- Cây sáo trúc -->
                    <line x1="12" y1="20" x2="38" y2="12" stroke="#d63031" stroke-width="2.5" stroke-linecap="round"/>
                </g>
            </svg>
        </div>

        <!-- Thỏ Ngọc dưới đất -->
        <div class="rabbit-container">
            <svg viewBox="0 0 60 60" width="100%" height="100%">
                <ellipse cx="28" cy="42" rx="14" ry="10" fill="#ffffff"/>
                <circle cx="36" cy="26" r="8" fill="#ffffff"/>
                <!-- Tai thỏ dài 2D -->
                <path d="M 32 20 C 28 5, 34 2, 35 18 Z" fill="#ffffff"/>
                <path d="M 38 20 C 38 4, 44 3, 40 19 Z" fill="#ffffff"/>
                <circle cx="12" cy="42" r="3" fill="#ffffff"/>
                <circle cx="39" cy="25" r="1.2" fill="#ff7675"/>
            </svg>
        </div>
    </div>

</body>
</html>
