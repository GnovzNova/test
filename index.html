<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pháo Hoa Rực Rỡ</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #000;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    const shells = [];
    const particles = [];

    // Bảng màu rực rỡ rực sáng
    const colors = [
      '#ff0055', '#ff5000', '#ffcc00', '#00ff66', 
      '#00ffff', '#0077ff', '#a000ff', '#ff00cc', '#ffffff'
    ];

    // Hạt pháo hoa sau khi nổ
    class Particle {
      constructor(x, y, color, angle, speed) {
        this.x = x;
        this.y = y;
        this.color = color;
        
        // Tính toán hướng bay theo góc tròn
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.alpha = 1;
        // Tốc độ mờ dần ngẫu nhiên cho hạt
        this.decay = Math.random() * 0.012 + 0.008; 
        this.gravity = 0.06;   // Trọng lực kéo hạt rơi xuống nhẹ nhàng
        this.friction = 0.96;  // Sức cản không khí giúp hạt xòe rộng ra
      }

      update() {
        this.vx *= this.friction;
        this.vy *= this.friction;
        this.vy += this.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
      }

      draw() {
        ctx.save();
        ctx.globalAlpha = Math.max(0, this.alpha);
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        // Hiệu ứng phát sáng hạt
        ctx.shadowBlur = 6;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }
    }

    // Tên lửa pháo hoa bắn lên
    class Shell {
      constructor() {
        this.x = Math.random() * (canvas.width * 0.8) + canvas.width * 0.1;
        this.y = canvas.height;
        this.targetY = Math.random() * (canvas.height * 0.45) + canvas.height * 0.1;
        this.speed = Math.random() * 3 + 10;
        this.color = colors[Math.floor(Math.random() * colors.length)];
      }

      update() {
        this.y -= this.speed;
        if (this.y <= this.targetY) {
          this.explode();
          return true; // Xóa quả pháo đã nổ
        }
        return false;
      }

      draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = this.color;
        ctx.fill();
        ctx.restore();
      }

      explode() {
        // Tạo hiệu ứng chớp sáng bầu trời khi nổ
        ctx.save();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = 0.12;
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();

        // Nổ xòe từ 150 đến 220 hạt rực rỡ
        const particleCount = Math.floor(Math.random() * 70) + 150;
        for (let i = 0; i < particleCount; i++) {
          const angle = Math.random() * Math.PI * 2;
          // Tốc độ nổ tỏa rộng ngẫu nhiên tạo khối cầu đẹp
          const speed = Math.random() * 9 + 1; 
          particles.push(new Particle(this.x, this.y, this.color, angle, speed));
        }
      }
    }

    // Vòng lặp vẽ liên tục (Animation)
    function loop() {
      // Đuôi vệt mờ bằng cách phủ lớp mờ đen
      ctx.fillStyle = 'rgba(0, 0, 0, 0.18)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Tự động thêm pháo hoa
      if (Math.random() < 0.045) {
        shells.push(new Shell());
      }

      // Cập nhật & Vẽ pháo hoa bắn lên
      for (let i = shells.length - 1; i >= 0; i--) {
        shells[i].draw();
        if (shells[i].update()) {
          shells.splice(i, 1);
        }
      }

      // Cập nhật & Vẽ các hạt nổ
      for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].alpha <= 0) {
          particles.splice(i, 1);
        }
      }

      requestAnimationFrame(loop);
    }

    // Nhấp chuột bất kỳ đâu để tạo thêm pháo hoa thủ công
    window.addEventListener('click', (e) => {
      const shell = new Shell();
      shell.x = e.clientX;
      shell.targetY = e.clientY;
      shells.push(shell);
    });

    loop();
  </script>
</body>
</html>
