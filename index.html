<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu 2D Art 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #050814;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 35%, #1e2746 0%, #080c1a 80%);
            overflow: hidden;
        }

        /* 1. TRĂNG TRÒN VÀNG */
        .moon {
            position: absolute;
            top: 8%; left: 50%;
            transform: translateX(-50%);
            width: 280px; height: 280px;
            background: radial-gradient(circle, #fffdf0 10%, #ffeaa7 60%, #fbc531 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px rgba(251, 197, 49, 0.5), 0 0 120px rgba(255, 234, 167, 0.2);
            z-index: 1;
        }

        /* 2. MÂY 2D CỔ ĐIỂN (Z-index 2 - ĐÈ ĐẸP LÊN TRĂNG) */
        .cloud {
            position: absolute;
            z-index: 2;
            opacity: 0.8;
            filter: drop-shadow(0 0 8px rgba(255, 234, 167, 0.3));
            animation: floatCloud 16s ease-in-out infinite alternate;
        }
        .cloud-1 { top: 12%; left: 15%; width: 220px; }
        .cloud-2 { top: 22%; right: 12%; width: 260px; animation-delay: -6s; }

        @keyframes floatCloud {
            0% { transform: translateX(-15px); }
            100% { transform: translateX(15px); }
        }

        /* 3. CHỊ HẰNG 2D VECTOR (PNG Chuẩn Bay Bên Trăng) */
        .chi-hang {
            position: absolute;
            top: 10%; right: 18%;
            width: 180px;
            z-index: 3;
            filter: drop-shadow(0 0 12px rgba(255, 234, 167, 0.6));
            animation: fairyFly 4s ease-in-out infinite alternate;
        }

        @keyframes fairyFly {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-20px) rotate(-3deg); }
        }

        /* 4. CÂY ĐA & CHÚ CUỘI (MẶT ĐẤT BÊN PHẢI) */
        .tree-cuoi {
            position: absolute;
            bottom: 0; right: 2%;
            width: 420px;
            z-index: 4;
            filter: drop-shadow(0 0 5px rgba(0,0,0,0.5));
        }

        /* 5. THỎ NGỌC ĐỨNG DƯỚI ĐẤT (BÊN TRÁI) */
        .tho-ngoc {
            position: absolute;
            bottom: 30px; left: 12%;
            width: 90px;
            z-index: 5;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.8));
            animation: rabbitBounce 2s ease-in-out infinite alternate;
        }

        @keyframes rabbitBounce {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-10px) scale(1.03); }
        }

        /* 6. MẶT ĐẤT CỎ MỜ */
        .ground {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 80px;
            background: linear-gradient(to top, #050814 20%, transparent);
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- Trăng tròn -->
        <div class="moon"></div>

        <!-- Mây 2D Á Đông -->
        <svg class="cloud cloud-1" viewBox="0 0 200 80" fill="#ffeaa7">
            <path d="M10 50 Q30 20 60 35 Q90 10 130 30 Q170 15 190 45 Q200 65 170 70 Q130 75 80 70 Q30 75 10 50 Z" opacity="0.4"/>
            <path d="M20 55 Q40 30 70 42 Q100 20 140 38 Q170 28 185 55 Q160 65 100 62 Q50 65 20 55 Z" fill="#ffffff" opacity="0.6"/>
        </svg>

        <svg class="cloud cloud-2" viewBox="0 0 200 80" fill="#ffeaa7">
            <path d="M10 40 Q40 10 80 25 Q120 5 160 25 Q190 20 195 50 Q170 70 110 65 Q50 70 10 40 Z" opacity="0.45"/>
        </svg>

        <!-- Chị Hằng (PNG Vector 2D) -->
        <img class="chi-hang" src="https://cdntest.staticflickr.com/65535/53982312381_85d58f3f88_o.png" alt="Chị Hằng 2D" onerror="this.src='https://images.rawpixel.com/image_png_800/png-3a3f3b.png'">

        <!-- Cây Đa & Chú Cuội 2D -->
        <img class="tree-cuoi" src="https://png.pngtree.com/png-clipart/20220818/ourmid/pngtree-banyan-tree-2d-vector-illustration-png-image_6115382.png" alt="Cây Đa Chú Cuội">

        <!-- Thỏ Ngọc (PNG Vector 2D) -->
        <img class="tho-ngoc" src="https://png.pngtree.com/png-clipart/20230814/original/pngtree-cute-rabbit-mid-autumn-festival-2d-png-image_10344211.png" alt="Thỏ Ngọc 2D">

        <!-- Mặt đất -->
        <div class="ground"></div>
    </div>

</body>
</html>
