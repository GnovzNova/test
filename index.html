<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pháo Hoa Giống Video</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            overflow: hidden;
            font-family: "Lucida Console", Monaco, monospace;
        }
        canvas {
            display: block;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .menu {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px;
            border-radius: 8px;
            z-index: 100;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }
        .menu label {
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .menu select {
            background: #222;
            color: #fff;
            border: 1px solid #444;
            padding: 5px;
            border-radius: 4px;
        }
        .help-text {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="menu">
        <label>Chế độ pháo hoa:
            <select id="shellType">
                <option value="Random">Ngẫu nhiên</option>
                <option value="Crysanthemum">Cúc đại đóa</option>
                <option value="Palm">Cây cọ</option>
                <option value="Ring">Vòng tròn</option>
                <option value="Crackle">Nổ lép bép</option>
            </select>
        </label>
        <label>Quy mô:
            <select id="shellSize">
                <option value="3">Bình thường</option>
                <option value="4">Lớn</option>
                <option value="5">Rất lớn</option>
            </select>
        </label>
        <label><input type="checkbox" id="autoLaunch" checked> Tự động bắn</label>
        <label><input type="checkbox" id="soundToggle"> Bật âm thanh</label>
    </div>

    <div class="help-text">Nhấp hoặc chạm vào màn hình để bắn pháo hoa thủ công</div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Audio Context cơ bản cho âm thanh pháo hoa
        let audioCtx = null;
        function playSound(type) {
            if (!document.getElementById('soundToggle').checked) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'launch') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'burst') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(80, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.8);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.8);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.8);
            }
        }

        class Shell {
            constructor(x, targetY, color, type, size) {
                this.x = x;
                this.y = height;
                this.targetY = targetY;
                this.speed = 12;
                this.angle = -Math.PI / 2 + (Math.random() - 0.5) * 0.1;
                this.color = color;
                this.type = type;
                this.size = size;
                this.trail = [];
                playSound('launch');
            }

            update() {
                this.trail.push({ x: this.x, y: this.y });
                if (this.trail.length > 5) this.trail.shift();

                const vx = Math.cos(this.angle) * this.speed;
                const vy = Math.sin(this.angle) * this.speed;
                this.x += vx;
                this.y += vy;

                if (this.y <= this.targetY) {
                    playSound('burst');
                    return true; // Đến điểm nổ
                }
                return false;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();

                // Vẽ đuôi pháo bay lên
                for (let i = 0; i < this.trail.length; i++) {
                    const point = this.trail[i];
                    ctx.beginPath();
                    ctx.arc(point.x, point.y, 1.5, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${i / this.trail.length * 0.5})`;
                    ctx.fill();
                }
            }
        }

        class Particle {
            constructor(x, y, color, type) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.type = type;
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.01;
                this.gravity = 0.15;
                this.sparkle = Math.random() < 0.3;
            }

            update() {
                this.vx *= 0.96;
                this.vy *= 0.96;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.sparkle && Math.random() < 0.5 ? 2.5 : 1.5, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        let shells = [];
        let particles = [];

        function createShell(startX, startY, targetX, targetY) {
            const colors = ['#ff3366', '#33ccff', '#ffcc00', '#66ff66', '#cc33ff', '#ffffff', '#ff9900'];
            const color = colors[Math.floor(Math.random() * colors.length)];
            
            let typeSelect = document.getElementById('shellType').value;
            let types = ['Crysanthemum', 'Palm', 'Ring', 'Crackle'];
            let type = typeSelect === 'Random' ? types[Math.floor(Math.random() * types.length)] : typeSelect;
            
            let size = parseInt(document.getElementById('shellSize').value);

            shells.push(new Shell(startX, targetY, color, type, size));
        }

        function explode(x, y, color, type, size) {
            let count = size * 30;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle(x, y, color, type));
            }
        }

        // Tự động bắn pháo hoa định kỳ
        let lastAutoLaunch = 0;
        function loop(timestamp) {
            // Hiệu ứng mờ dần tạo vệt sáng (Motion Blur)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            if (document.getElementById('autoLaunch').checked && timestamp - lastAutoLaunch > 800) {
                createShell(Math.random() * width, 0, Math.random() * (width - 200) + 100, Math.random() * (height * 0.5) + 50);
                lastAutoLaunch = timestamp;
            }

            for (let i = shells.length - 1; i >= 0; i--) {
                shells[i].draw();
                if (shells[i].update()) {
                    explode(shells[i].x, shells[i].y, shells[i].color, shells[i].type, shells[i].size);
                    shells.splice(i, 1);
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0) {
                    particles.splice(i, 1);
                }
            }

            requestAnimationFrame(loop);
        }

        // Bắn thủ công bằng cách click/chạm
        window.addEventListener('click', (e) => {
            if (e.target.tagName === 'SELECT' || e.target.tagName === 'INPUT' || e.target.tagName === 'LABEL') return;
            createShell(e.clientX, height, e.clientX, e.clientY);
        });

        requestAnimationFrame(loop);
    </script>
</body>
</html>
