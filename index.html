<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trung Thu Rằm Tháng Tám 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020514;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 35%, #1a233a 0%, #050b1a 65%, #020514 100%);
            overflow: hidden;
        }

        /* 1. MẶT TRĂNG CỰC MƯỢT */
        .moon {
            position: absolute;
            top: 35%; left: 50%;
            transform: translate(-50%, -60%);
            width: 300px; height: 300px;
            border-radius: 50%;
            background: #fff8d6;
            box-shadow: 
                0 0 30px #fff1a0,
                0 0 90px rgba(253, 203, 110, 0.7),
                0 0 160px rgba(253, 203, 110, 0.3);
            z-index: 1;
        }

        /* 2. CHỊ HẰNG CỔ PHONG */
        .hang-nga {
            position: absolute;
            top: 12%; right: 26%;
            z-index: 4;
            filter: drop-shadow(0 0 10px rgba(255, 234, 167, 0.5));
            animation: float 4s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }

        /* 3. CÂY ĐA & CUỘI TOÀN BỘ TRONG 1 SVG ĐỂ KHÔNG BỊ LỆCH TỶ LỆ */
        .banyan-and-cuoi {
            position: absolute;
            bottom: 0; right: 0;
            width: 600px; height: 650px;
            z-index: 5;
        }

        /* 4. THỎ NGỌC */
        .rabbit {
            position: absolute;
            bottom: 45px; left: 15%;
            z-index: 6;
            animation: hop 2s ease-in-out infinite alternate;
        }

        @keyframes hop {
            0% { transform: translateY(0); }
            100% { transform: translateY(-6px); }
        }

        /* 5. MẶT ĐẤT NHẤP NHÔ ĐỒI NÚI (KHÔNG THẲNG LỲ NỮA) */
        .ground-svg {
            position: absolute;
            bottom: 0; left: 0;
            width: 100vw; height: 160px;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- TRĂNG -->
        <div class="moon"></div>

        <!-- MẶT ĐẤT UỐN LƯỢN TỰ NHIÊN -->
        <svg class="ground-svg" viewBox="0 0 1440 160" preserveAspectRatio="none">
            <path d="M0,80 Q360,130 720,70 Q1080,10 1440,80 L1440,160 L0,160 Z" fill="#051409"/>
            <path d="M0,100 Q400,60 800,110 Q1200,160 1440,90 L1440,160 L0,160 Z" fill="#020804" opacity="0.8"/>
        </svg>

        <!-- CHỊ HẰNG MỞ RỘNG TAY NGA NGHỆ THUẬT -->
        <div class="hang-nga">
            <svg width="180" height="200" viewBox="0 0 180 200">
                <!-- Dải lụa mềm bay quanh -->
                <path d="M 20,120 Q 10,20 90,15 Q 170,10 160,100 Q 150,170 80,185 Q 20,190 30,130" fill="none" stroke="#ff7675" stroke-width="3.5" opacity="0.8"/>
                
                <!-- Váy xòe mềm -->
                <path d="M 80,85 L 40,180 Q 90,195 135,175 L 100,85 Z" fill="#fd79a8"/>
                <path d="M 82,85 L 55,178 Q 88,188 120,175 L 98,85 Z" fill="#ffffff" opacity="0.85"/>
                
                <!-- Tay áo rộng bay -->
                <path d="M 75,55 C 40,80 30,110 50,115 C 65,115 75,95 80,85 Z" fill="#e84393"/>
                <path d="M 105,55 C 140,80 150,110 130,115 C 115,115 105,95 100,85 Z" fill="#e84393"/>
                
                <!-- Thân & Đầu -->
                <path d="M 78,55 L 72,85 L 108,85 L 102,55 Z" fill="#fab1a0"/>
                <circle cx="90" cy="42" r="10" fill="#ffeaa7"/>
                <ellipse cx="90" cy="26" rx="7" ry="9" fill="#2d3436"/>
                <line x1="78" y1="26" x2="102" y2="26" stroke="#fdcb6e" stroke-width="2"/>
            </svg>
        </div>

        <!-- CÂY ĐA CỔ THỤ + CUỘI NGHỆ THUẬT (RỄ ĐẦM XUỐNG ĐẤT TỰ NHIÊN) -->
        <svg class="banyan-and-cuoi" viewBox="0 0 600 650">
            <defs>
                <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0%" stop-color="#1a0d06"/>
                    <stop offset="50%" stop-color="#361c0c"/>
                    <stop offset="100%" stop-color="#0f0703"/>
                </linearGradient>
            </defs>

            <!-- Tán lá đồi mượt -->
            <path d="M 150,250 Q 80,80 240,30 Q 400,-20 540,50 Q 620,150 560,280 Q 500,380 380,330 Q 260,400 150,250 Z" fill="#07190b"/>
            <path d="M 190,220 Q 140,90 260,50 Q 370,10 490,60 Q 560,140 500,250 Q 420,320 300,290 Z" fill="#0f3014"/>
            <path d="M 230,180 Q 190,90 280,60 Q 370,30 450,80 Q 500,140 450,210 Q 370,250 280,230 Z" fill="#184a1f"/>

            <!-- Thân cây cổ thụ uốn lượn có gốc to -->
            <path d="M 400,650 C 370,500 320,350 290,260 C 260,180 220,150 200,140 L 235,130 C 260,160 295,220 330,300 C 380,420 420,530 520,650 Z" fill="url(#trunkGrad)"/>
            
            <!-- Rễ cây rủ xuống mềm mại, cắm ẩn vào mặt đất chứ KHÔNG THẲNG TẮC -->
            <path d="M 280,240 Q 250,400 220,650" stroke="#241308" stroke-width="7" fill="none" stroke-linecap="round"/>
            <path d="M 240,200 Q 210,380 170,650" stroke="#1a0d06" stroke-width="5" fill="none" stroke-linecap="round"/>
            <path d="M 350,330 Q 360,480 340,650" stroke="#241308" stroke-width="6" fill="none" stroke-linecap="round"/>

            <!-- CHÚ CUỘI NGỒI DÁNG THƯ THÁI THỔI SÁO -->
            <g transform="translate(250, 470)">
                <!-- Bóng lưng tựa gốc cây -->
                <!-- Chân xếp khoanh tròn -->
                <path d="M 10,110 C 10,90 35,80 65,80 C 95,80 110,90 110,110 C 90,125 30,125 10,110 Z" fill="#2b1a0d"/> 
                <!-- Thân áo nâu -->
                <path d="M 30,50 C 25,70 30,95 40,100 L 85,100 C 95,95 95,70 90,50 C 75,40 45,40 30,50 Z" fill="#6e421f"/>
                
                <!-- Đầu & Búi tóc chuẩn trai cổ đại -->
                <circle cx="60" cy="30" r="13" fill="#ffeaa7"/>
                <path d="M 49,27 C 60,16 71,27 71,27 C 71,18 60,15 49,27 Z" fill="#2d3436"/>
                <circle cx="60" cy="13" r="5" fill="#2d3436"/> <!-- Búi tóc -->

                <!-- CÂY SÁO TRÚC ĐẶT NGANG MIỆNG NÉT CĂNG -->
                <line x1="15" y1="35" x2="105" y2="28" stroke="#f1c40f" stroke-width="4.5" stroke-linecap="round"/>
                
                <!-- Tay cầm sáo tự nhiên (Không bị dị tật nữa) -->
                <path d="M 42,65 Q 52,42 56,36" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round" fill="none"/>
                <path d="M 78,65 Q 68,42 64,36" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round" fill="none"/>
            </g>
        </svg>

        <!-- THỎ NGỌC DỄ THƯƠNG -->
        <div class="rabbit">
            <svg width="90" height="100" viewBox="0 0 100 110">
                <circle cx="20" cy="80" r="7" fill="#ffffff"/>
                <ellipse cx="45" cy="78" rx="25" ry="18" fill="#ffffff"/>
                <circle cx="62" cy="50" r="18" fill="#ffffff"/>
                <circle cx="70" cy="46" r="2.5" fill="#2d3436"/>
                <circle cx="77" cy="50" r="1.5" fill="#ff7675"/>
                <circle cx="65" cy="54" r="3.5" fill="#ff7675" opacity="0.3"/>
                <ellipse cx="54" cy="20" rx="5" ry="18" fill="#ffffff" transform="rotate(-10 54 20)"/>
                <ellipse cx="54" cy="20" rx="2.5" ry="12" fill="#ffcaa1" transform="rotate(-10 54 20)"/>
                <ellipse cx="66" cy="18" rx="5" ry="19" fill="#ffffff" transform="rotate(8 66 18)"/>
                <ellipse cx="66" cy="18" rx="2.5" ry="13" fill="#ffcaa1" transform="rotate(8 66 18)"/>
            </svg>
        </div>
    </div>

</body>
</html>
