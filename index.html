<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Rằm Trung Thu 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020514;
            overflow: hidden;
            width: 100vw; height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        /* KHUNG CẢNH TỔNG THỂ CÓ THỂ ZOOM OUT */
        #world {
            position: absolute;
            width: 100vw; height: 100vh;
            transition: transform 3.5s cubic-bezier(0.25, 1, 0.5, 1);
            transform-origin: 50% 30%;
        }

        /* 1. KHUNG CẢNH TRÊN MẶT TRĂNG (ZOOM OUT SẼ THÀNH TRĂNG TRÒN) */
        .moon-surface {
            position: absolute;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 50%, #1a233a 0%, #050b1a 70%, #020514 100%);
            transition: all 3s ease;
        }

        /* 2. LỒNG ĐÈN & LỜI CHÚC */
        .lantern-container {
            position: absolute;
            bottom: -150px; left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .lantern-container.show {
            opacity: 1;
            animation: floatUp 12s linear forwards;
        }

        @keyframes floatUp {
            0% { transform: translate(-50%, 0); }
            80% { opacity: 1; }
            100% { transform: translate(-50%, -90vh); opacity: 0; }
        }

        .lantern-svg {
            width: 80px; height: 100px;
            filter: drop-shadow(0 0 15px #ff7675);
        }

        .wish-box {
            margin-top: 15px;
            background: rgba(255, 248, 214, 0.9);
            padding: 10px 20px;
            border-radius: 20px;
            color: #d63031;
            font-weight: bold;
            font-size: 1.2rem;
            box-shadow: 0 0 20px rgba(255, 234, 167, 0.8);
            white-space: nowrap;
        }

        /* THÔNG BÁO CLICK */
        .click-hint {
            position: absolute;
            top: 20%; left: 50%;
            transform: translate(-50%, -50%);
            color: #ffeaa7;
            font-size: 1.3rem;
            font-weight: bold;
            text-shadow: 0 0 10px #fdcb6e;
            opacity: 0;
            transition: opacity 1s ease;
            z-index: 20;
            cursor: pointer;
            pointer-events: none;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(0.95); }
            100% { transform: translate(-50%, -50%) scale(1.05); }
        }

        /* 3. TRÁI ĐẤT & BÓNG 2 NGƯỜI (ẨN Ban Đầu) */
        .earth-scene {
            position: absolute;
            bottom: -100%; left: 0;
            width: 100vw; height: 100vh;
            z-index: 8;
            transition: bottom 3s ease-in-out;
            pointer-events: none;
        }

        .ground-earth {
            position: absolute;
            bottom: 0; left: 0;
            width: 100vw; height: 180px;
            background: linear-gradient(to top, #02050e, #0a1128);
        }

        /* BÓNG 2 NGƯỜI DỰA VAO NHAU */
        .couple-silhouette {
            position: absolute;
            bottom: 40px; left: 50%;
            transform: translateX(-50%);
            z-index: 9;
        }

        /* CANVAS CẢNH HẠT ĐOM ĐÓM & PHÁO HOA */
        #main-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2;
            pointer-events: none;
        }

        /* ELEMENT CHỊ HẰNG, CÂY ĐA, CUỘI */
        .hang-nga {
            position: absolute;
            top: 15%; right: 20%;
            z-index: 4;
            filter: drop-shadow(0 0 12px rgba(255, 234, 167, 0.6));
            animation: float 4s ease-in-out infinite alternate;
        }

        @keyframes float {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }

        .banyan-and-cuoi {
            position: absolute;
            bottom: 0; right: 0;
            width: 600px; height: 650px;
            z-index: 5;
        }

        .rabbit {
            position: absolute;
            bottom: 40px; left: 15%;
            z-index: 6;
        }

        .ground-moon {
            position: absolute;
            bottom: 0; left: 0;
            width: 100vw; height: 140px;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div id="world">
        <canvas id="main-canvas"></canvas>

        <!-- BỀ MẶT MẶT TRĂNG -->
        <div class="moon-surface" id="moonSurface">
            <!-- ĐẤT MẶT TRĂNG -->
            <svg class="ground-moon" viewBox="0 0 1440 140" preserveAspectRatio="none">
                <path d="M0,60 Q360,110 720,50 Q1080,0 1440,60 L1440,140 L0,140 Z" fill="#1e272e"/>
                <path d="M0,80 Q400,40 800,90 Q1200,140 1440,70 L1440,140 L0,140 Z" fill="#0f171e" opacity="0.8"/>
            </svg>

            <!-- CHỊ HẰNG -->
            <div class="hang-nga">
                <svg width="180" height="200" viewBox="0 0 180 200">
                    <path d="M 20,120 Q 10,20 90,15 Q 170,10 160,100 Q 150,170 80,185 Q 20,190 30,130" fill="none" stroke="#ff7675" stroke-width="3.5" opacity="0.8"/>
                    <path d="M 80,85 L 40,180 Q 90,195 135,175 L 100,85 Z" fill="#fd79a8"/>
                    <path d="M 82,85 L 55,178 Q 88,188 120,175 L 98,85 Z" fill="#ffffff" opacity="0.85"/>
                    <path d="M 75,55 C 40,80 30,110 50,115 C 65,115 75,95 80,85 Z" fill="#e84393"/>
                    <path d="M 105,55 C 140,80 150,110 130,115 C 115,115 105,95 100,85 Z" fill="#e84393"/>
                    <path d="M 78,55 L 72,85 L 108,85 L 102,55 Z" fill="#fab1a0"/>
                    <circle cx="90" cy="42" r="10" fill="#ffeaa7"/>
                    <ellipse cx="90" cy="26" rx="7" ry="9" fill="#2d3436"/>
                    <line x1="78" y1="26" x2="102" y2="26" stroke="#fdcb6e" stroke-width="2"/>
                </svg>
            </div>

            <!-- CÂY ĐA & CUỘI -->
            <svg class="banyan-and-cuoi" viewBox="0 0 600 650">
                <defs>
                    <linearGradient id="trunkGrad" x1="0" y1="0" x2="1" y2="0">
                        <stop offset="0%" stop-color="#1a0d06"/>
                        <stop offset="50%" stop-color="#361c0c"/>
                        <stop offset="100%" stop-color="#0f0703"/>
                    </linearGradient>
                </defs>
                <path d="M 150,250 Q 80,80 240,30 Q 400,-20 540,50 Q 620,150 560,280 Q 500,380 380,330 Q 260,400 150,250 Z" fill="#07190b"/>
                <path d="M 190,220 Q 140,90 260,50 Q 370,10 490,60 Q 560,140 500,250 Q 420,320 300,290 Z" fill="#0f3014"/>
                <path d="M 400,650 C 370,500 320,350 290,260 C 260,180 220,150 200,140 L 235,130 C 260,160 295,220 330,300 C 380,420 420,530 520,650 Z" fill="url(#trunkGrad)"/>
                <path d="M 280,240 Q 230,420 210,650" stroke="#1a0d06" stroke-width="8" fill="none" stroke-linecap="round"/>

                <!-- CUỘI THỔI SÁO -->
                <g transform="translate(250, 470)">
                    <path d="M 10,110 C 10,90 35,80 65,80 C 95,80 110,90 110,110 C 90,125 30,125 10,110 Z" fill="#2b1a0d"/> 
                    <path d="M 30,50 C 25,70 30,95 40,100 L 85,100 C 95,95 95,70 90,50 C 75,40 45,40 30,50 Z" fill="#6e421f"/>
                    <circle cx="60" cy="30" r="13" fill="#ffeaa7"/>
                    <circle cx="60" cy="13" r="5" fill="#2d3436"/>
                    <line x1="15" y1="35" x2="105" y2="28" stroke="#f1c40f" stroke-width="4.5" stroke-linecap="round"/>
                    <path d="M 40,65 Q 48,42 54,34" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round" fill="none"/>
                    <path d="M 80,65 Q 70,42 66,34" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round" fill="none"/>
                </g>
            </svg>

            <!-- THỎ NGỌC -->
            <div class="rabbit">
                <svg width="90" height="100" viewBox="0 0 100 110">
                    <circle cx="20" cy="80" r="7" fill="#ffffff"/>
                    <ellipse cx="45" cy="78" rx="25" ry="18" fill="#ffffff"/>
                    <circle cx="62" cy="50" r="18" fill="#ffffff"/>
                    <circle cx="70" cy="46" r="2.5" fill="#2d3436"/>
                    <ellipse cx="54" cy="20" rx="5" ry="18" fill="#ffffff" transform="rotate(-10 54 20)"/>
                    <ellipse cx="66" cy="18" rx="5" ry="19" fill="#ffffff" transform="rotate(8 66 18)"/>
                </svg>
            </div>
        </div>

        <!-- LỒNG ĐÈN CHẠY LỜI CHÚC -->
        <div class="lantern-container" id="lantern">
            <svg class="lantern-svg" viewBox="0 0 100 120">
                <path d="M 30,20 L 70,20 L 85,60 L 70,100 L 30,100 L 15,60 Z" fill="#e74c3c"/>
                <path d="M 35,20 L 65,20 L 75,60 L 65,100 L 35,100 L 25,60 Z" fill="#f1c40f"/>
                <circle cx="50" cy="60" r="12" fill="#ffffff" opacity="0.8"/>
                <line x1="50" y1="100" x2="50" y2="120" stroke="#f39c12" stroke-width="3"/>
            </svg>
            <div class="wish-box" id="wishText">Lời chúc a</div>
        </div>

        <!-- DÒNG THÔNG BÁO CLICK -->
        <div class="click-hint" id="clickHint">✨ Click vào màn hình để ngắm Trăng từ Trái Đất ✨</div>
    </div>

    <!-- KHUNG CẢNH TRÁI ĐẤT & BÓNG 2 NGƯỜI -->
    <div class="earth-scene" id="earthScene">
        <div class="ground-earth"></div>
        <!-- SVG BÓNG 2 NGƯỜI DỰA VÀO NHAU -->
        <svg class="couple-silhouette" width="160" height="120" viewBox="0 0 160 120">
            <!-- Nam -->
            <circle cx="65" cy="35" r="14" fill="#02050e"/>
            <path d="M 40,120 C 40,70 55,55 75,55 C 80,55 85,70 85,120 Z" fill="#02050e"/>
            <!-- Nữ dựa đầu vào vai -->
            <circle cx="88" cy="42" r="12" fill="#02050e"/>
            <path d="M 75,120 C 75,75 85,62 105,65 C 115,75 110,90 115,120 Z" fill="#02050e"/>
        </svg>
    </div>

    <script>
        // 1. CHẠY SEQUENCE LỜI CHÚC (A -> B -> C)
        const wishes = ["a", "b", "c"];
        let wishIndex = 0;
        const wishText = document.getElementById('wishText');
        const lantern = document.getElementById('lantern');
        const clickHint = document.getElementById('clickHint');
        const moonSurface = document.getElementById('moonSurface');
        const world = document.getElementById('world');
        const earthScene = document.getElementById('earthScene');

        function startWishes() {
            lantern.classList.add('show');
            const interval = setInterval(() => {
                wishIndex++;
                if (wishIndex < wishes.length) {
                    wishText.innerText = wishes[wishIndex];
                } else {
                    clearInterval(interval);
                    // Hết 3 lời chúc -> Lồng đèn bay mất & Sáng bừng bề mặt trăng
                    setTimeout(() => {
                        lantern.style.display = 'none';
                        moonSurface.style.boxShadow = 'inset 0 0 100px #fff1a0';
                        clickHint.style.opacity = '1';
                        clickHint.style.pointerEvents = 'auto';
                    }, 2000);
                }
            }, 3500);
        }

        // Kích hoạt lời chúc sau 1s
        setTimeout(startWishes, 1000);

        // 2. SỰ KIỆN CLICK MẶT TRĂNG -> ZOOM OUT VỀ TRÁI ĐẤT
        let sequenceStarted = false;
        document.body.addEventListener('click', () => {
            if (clickHint.style.opacity === '1' && !sequenceStarted) {
                sequenceStarted = true;
                clickHint.style.opacity = '0';

                // Zoom out cực nhỏ toàn bộ bề mặt trăng thành 1 quả cầu trăng rằm!
                world.style.transform = 'scale(0.12) translateY(-250vh)';
                moonSurface.style.borderRadius = '50%';
                moonSurface.style.boxShadow = '0 0 80px #fff1a0, 0 0 150px rgba(253, 203, 110, 0.8)';

                // Dịch chuyển cảnh Trái Đất lên
                setTimeout(() => {
                    earthScene.style.bottom = '0';
                }, 1500);

                // Đợi 2s sau khi chuyển cảnh xong -> KÍCH HOẠT PHÁO HOA
                setTimeout(() => {
                    startFireworks();
                }, 4500);
            }
        });

        // 3. CANVAS ĐOM ĐÓM & PHÁO HOA SYSTEM
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Particle đom đóm ban đầu
        const fireflies = Array.from({length: 50}, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            r: Math.random() * 2 + 1,
            sX: (Math.random() - 0.5) * 0.5,
            sY: -Math.random() * 0.5 - 0.2,
            a: Math.random()
        }));

        // Pháo hoa System
        let fireworks = [];
        let isFireworksActive = false;

        function createFirework() {
            const x = Math.random() * canvas.width * 0.8 + canvas.width * 0.1;
            const y = Math.random() * canvas.height * 0.4 + canvas.height * 0.1;
            const count = 60;
            const color = `hsl(${Math.random() * 360}, 100%, 65%)`;

            for (let i = 0; i < count; i++) {
                const angle = (Math.PI * 2 / count) * i;
                const speed = Math.random() * 4 + 2;
                fireworks.push({
                    x, y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    alpha: 1,
                    color
                });
            }
        }

        function startFireworks() {
            isFireworksActive = true;
            setInterval(createFirework, 800);
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Render đom đóm
            fireflies.forEach(f => {
                f.x += f.sX; f.y += f.sY;
                if (f.y < 0) f.y = canvas.height;
                ctx.beginPath();
                ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2);
                ctx.fillStyle = '#ffeaa7';
                ctx.globalAlpha = f.a;
                ctx.fill();
            });

            // Render Pháo hoa khi activated
            if (isFireworksActive) {
                fireworks.forEach((p, index) => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.04; // Trọng lực
                    p.alpha -= 0.015;

                    if (p.alpha <= 0) {
                        fireworks.splice(index, 1);
                    } else {
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
                        ctx.fillStyle = p.color;
                        ctx.globalAlpha = p.alpha;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = p.color;
                        ctx.fill();
                    }
                });
            }

            requestAnimationFrame(animate);
        }
        animate();
    </script>
</body>
</html>
