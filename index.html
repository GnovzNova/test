<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pháo Hoa Nghệ Thuật Toàn Màn Hình</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.1s ease;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .menu-container {
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 100;
            opacity: 0.8;
            transition: opacity 0.3s;
        }
        .menu-container:hover {
            opacity: 1;
        }
        .menu {
            display: flex;
            flex-direction: column;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 8px;
            color: #fff;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .menu label {
            margin: 5px 0;
            cursor: pointer;
            font-size: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .menu input {
            margin-left: 10px;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            pointer-events: none;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="instructions">Chạm hoặc click chuột bất kỳ đâu để bắn pháo hoa</div>

    <div class="menu-container">
        <div class="menu">
            <label>Tự động bắn <input type="checkbox" id="auto-launch" checked></label>
            <label>Hiệu ứng chớp sáng <input type="checkbox" id="flash-effect" checked></label>
        </div>
    </div>

    <canvas id="fireworksCanvas"></canvas>

    <script>
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');

        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        // Trạng thái chung
        const config = {
            autoLaunch: true,
            flashEffect: true
        };

        document.getElementById('auto-launch').addEventListener('change', (e) => {
            config.autoLaunch = e.target.checked;
        });
        document.getElementById('flash-effect').addEventListener('change', (e) => {
            config.flashEffect = e.target.checked;
        });

        // Quản lý hiệu ứng chớp sáng bầu trời
        let skyFlashIntensity = 0;
        function triggerSkyFlash(color) {
            if (!config.flashEffect) return;
            skyFlashIntensity = 0.15; // Độ sáng lóe lên
            // Chuyển đổi màu sắc sang rgba mờ
            document.body.style.backgroundColor = color;
            setTimeout(() => {
                document.body.style.backgroundColor = '#000000';
            }, 50);
        }

        // Mảng màu sắc pháo hoa
        const colors = [
            '#ff3333', '#33ff33', '#3366ff', '#ffff33', '#ff33ff', '#33ffff', 
            '#ff9933', '#ff99ff', '#99ff33', '#ffffff', '#ff69b4', '#00ffcc'
        ];

        class Particle {
            constructor(x, y, color, angle, speed, friction, gravity, size, alphaDecrease, shape = 'normal') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.angle = angle;
                this.speed = speed;
                this.friction = friction;
                this.gravity = gravity;
                this.size = size;
                this.alpha = 1;
                this.alphaDecrease = alphaDecrease;
                this.shape = shape;
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
            }

            update() {
                this.vx *= this.friction;
                this.vy *= this.friction;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.alpha -= this.alphaDecrease;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.fillStyle = this.color;
                ctx.strokeStyle = this.color;

                if (this.shape === 'heart') {
                    // Vẽ hình trái tim
                    ctx.beginPath();
                    let t = this.size;
                    ctx.moveTo(this.x, this.y);
                    ctx.bezierCurveTo(this.x - t, this.y - t, this.x - t * 2, this.y + t / 2, this.x, this.y + t * 1.5);
                    ctx.bezierCurveTo(this.x + t * 2, this.y + t / 2, this.x + t, this.y - t, this.x, this.y);
                    ctx.fill();
                } else {
                    // Hình tròn tiêu chuẩn
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore();
            }
        }

        class Firework {
            constructor(startX, startY, targetX, targetY, color) {
                this.x = startX;
                this.y = startY;
                this.startX = startX;
                this.startY = startY;
                this.targetX = targetX;
                this.targetY = targetY;
                this.color = color;
                this.distanceToTarget = Math.hypot(targetX - startX, targetY - startY);
                this.distanceTraveled = 0;
                this.angle = Math.atan2(targetY - startY, targetX - startX);
                this.speed = 12;
                this.acceleration = 1.05;
                this.particles = [];
                this.status = 'launching'; // launching, exploded, dead
            }

            update() {
                if (this.status === 'launching') {
                    this.speed *= this.acceleration;
                    let vx = Math.cos(this.angle) * this.speed;
                    let vy = Math.sin(this.angle) * this.speed;
                    this.distanceTraveled = Math.hypot(this.x - this.startX, this.y - this.startY);

                    if (this.distanceTraveled >= this.distanceToTarget || this.y <= this.targetY) {
                        this.explode();
                        this.status = 'exploded';
                    } else {
                        this.x += vx;
                        this.y += vy;
                    }
                } else if (this.status === 'exploded') {
                    this.particles.forEach((p, index) => {
                        p.update();
                        if (p.alpha <= 0) {
                            this.particles.splice(index, 1);
                        }
                    });
                    if (this.particles.length === 0) {
                        this.status = 'dead';
                    }
                }
            }

            draw() {
                if (this.status === 'launching') {
                    ctx.save();
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = this.color;
                    ctx.fill();
                    ctx.restore();
                } else if (this.status === 'exploded') {
                    this.particles.forEach(p => p.draw());
                }
            }

            explode() {
                // Tạo hiệu ứng chớp sáng bầu trời ứng với màu pháo hoa
                triggerSkyFlash(this.color);

                // Chọn ngẫu nhiên loại hình nổ phong phú
                const types = ['circle', 'ring', 'heart', 'multi-layer', 'star'];
                const selectedType = types[Math.floor(Math.random() * types.length)];
                
                const particleCount = 120;

                if (selectedType === 'circle') {
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = Math.random() * 6 + 2;
                        this.particles.push(new Particle(this.targetX, this.targetY, this.color, angle, speed, 0.95, 0.08, Math.random() * 2 + 1, 0.015));
                    }
                } else if (selectedType === 'ring') {
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = 5; // Tốc độ đều tạo vành khuyên
                        this.particles.push(new Particle(this.targetX, this.targetY, this.color, angle, speed, 0.96, 0.05, 2, 0.02));
                    }
                } else if (selectedType === 'heart') {
                    for (let i = 0; i < particleCount; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 4 + 1;
                        this.particles.push(new Particle(this.targetX, this.targetY, this.color, angle, speed, 0.94, 0.04, 2.5, 0.015, 'heart'));
                    }
                } else if (selectedType === 'multi-layer') {
                    // Nổ 2 lớp màu khác nhau
                    const secondaryColor = colors[Math.floor(Math.random() * colors.length)];
                    for (let i = 0; i < particleCount; i++) {
                        const angle = (Math.PI * 2 / particleCount) * i;
                        const speed = i % 2 === 0 ? Math.random() * 7 + 3 : Math.random() * 4 + 1;
                        const col = i % 2 === 0 ? this.color : secondaryColor;
                        this.particles.push(new Particle(this.targetX, this.targetY, col, angle, speed, 0.95, 0.07, 2, 0.018));
                    }
                } else {
                    // Kiểu mưa sao băng rơi xuống
                    for (let i = 0; i < particleCount; i++) {
                        const angle = Math.random() * Math.PI * 2;
                        const speed = Math.random() * 8 + 1;
                        this.particles.push(new Particle(this.targetX, this.targetY, this.color, angle, speed, 0.92, 0.15, Math.random() * 2, 0.025));
                    }
                }
            }
        }

        let fireworks = [];

        // Thêm pháo hoa tự động
        let lastLaunchTime = 0;
        function loop(timestamp) {
            // Hiệu ứng lưu ảnh chuyển động mờ ảo (motion blur)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.2)';
            ctx.fillRect(0, 0, width, height);

            if (config.autoLaunch && timestamp - lastLaunchTime > 600) {
                let startX = Math.random() * width;
                let targetX = Math.random() * (width - 200) + 100;
                let targetY = Math.random() * (height * 0.5) + 50;
                let color = colors[Math.floor(Math.random() * colors.length)];
                fireworks.push(new Firework(startX, height, targetX, targetY, color));
                lastLaunchTime = timestamp;
            }

            fireworks.forEach((fw, index) => {
                fw.update();
                fw.draw();
                if (fw.status === 'dead') {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(loop);
        }

        requestAnimationFrame(loop);

        // Click hoặc chạm màn hình để bắn pháo hoa thủ công tại vị trí bấm
        window.addEventListener('click', (e) => {
            let startX = width / 2;
            let targetX = e.clientX;
            let targetY = e.clientY;
            let color = colors[Math.floor(Math.random() * colors.length)];
            fireworks.push(new Firework(startX, height, targetX, targetY, color));
        });
    </script>
</body>
</html>
