<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Rằm Trung Thu 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #02050e;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, #172038 0%, #030611 80%);
            overflow: hidden;
        }

        /* 1. MẶT TRĂNG KHỔNG LỒ */
        .moon-glow {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -60%);
            width: 480px; height: 480px;
            background: radial-gradient(circle, #ffffff 0%, #fff3a1 40%, #fbc531 70%, rgba(251,197,49,0) 100%);
            border-radius: 50%;
            filter: drop-shadow(0 0 60px rgba(251, 197, 49, 0.6));
            z-index: 1;
        }

        /* 2. CHỊ HẰNG BAY */
        .hang-nga {
            position: absolute;
            top: 15%; right: 28%;
            width: 190px;
            z-index: 4;
            filter: drop-shadow(0 0 15px rgba(255, 234, 167, 0.8));
            animation: hangFly 4s ease-in-out infinite alternate;
        }

        @keyframes hangFly {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-18px) rotate(-3deg); }
        }

        /* 3. CÂY ĐA KHỔNG LỒ & CUỘI THỔI SÁO */
        .tree-and-cuoi {
            position: absolute;
            bottom: -10px; right: -20px;
            width: 620px;
            height: 650px;
            z-index: 5;
            filter: drop-shadow(-8px 0 20px rgba(0,0,0,0.8));
        }

        /* 4. THỎ NGỌC NGỒI NGẮM TRĂNG */
        .tho-ngoc {
            position: absolute;
            bottom: 45px; left: 16%;
            width: 110px;
            z-index: 6;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.6));
            animation: rabbitLook 3s ease-in-out infinite alternate;
        }

        @keyframes rabbitLook {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(-6px) scale(1.02); }
        }

        /* 5. MÂY TRÔI & MẶT ĐẤT */
        .cloud {
            position: absolute;
            z-index: 2;
            opacity: 0.45;
            animation: floatCloud 18s ease-in-out infinite alternate;
        }
        .cloud-1 { top: 8%; left: 5%; width: 320px; }
        .cloud-2 { top: 25%; right: 5%; width: 380px; animation-delay: -7s; }

        @keyframes floatCloud {
            0% { transform: translateX(-30px); }
            100% { transform: translateX(30px); }
        }

        .ground-svg {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 160px;
            z-index: 3;
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- TRĂNG RẰM TO BỰ -->
        <div class="moon-glow"></div>

        <!-- MÂY 2D -->
        <svg class="cloud cloud-1" viewBox="0 0 200 60">
            <path d="M 10,40 Q 30,10 70,20 Q 110,0 150,20 Q 180,10 190,35 Q 200,55 160,55 L 20,55 Z" fill="#2d3548"/>
        </svg>
        <svg class="cloud cloud-2" viewBox="0 0 200 60">
            <path d="M 10,40 Q 40,10 80,20 Q 120,5 160,25 Q 190,20 195,50 L 10,50 Z" fill="#1e2536"/>
        </svg>

        <!-- CHỊ HẰNG NGA -->
        <svg class="hang-nga" viewBox="0 0 200 250">
            <path d="M 20,100 Q 60,20 120,50 Q 180,80 170,160 Q 160,210 100,220 Q 40,220 30,160" fill="none" stroke="#ff7675" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
            <path d="M 10,110 Q 50,30 115,58 Q 170,90 160,165" fill="none" stroke="#ffeaa7" stroke-width="4" stroke-linecap="round"/>
            <path d="M 75,110 Q 60,160 40,210 Q 90,230 130,200 Q 120,150 105,110 Z" fill="#fd79a8"/>
            <path d="M 82,110 Q 70,160 55,205 Q 90,218 120,195 Q 110,150 100,110 Z" fill="#ffffff" opacity="0.9"/>
            <path d="M 78,80 L 65,115 L 90,120 L 102,115 L 92,80 Z" fill="#fab1a0"/>
            <path d="M 85,80 L 105,115 L 115,100 L 95,80 Z" fill="#ffeaa7"/>
            <path d="M 70,85 Q 40,110 30,140 Q 55,145 72,115 Z" fill="#fd79a8"/>
            <path d="M 100,85 Q 130,110 145,135 Q 125,140 105,115 Z" fill="#fd79a8"/>
            <circle cx="88" cy="62" r="14" fill="#ffeaa7"/>
            <path d="M 74,58 Q 88,42 102,58 Q 102,48 88,44 Q 74,48 74,58 Z" fill="#2d3436"/>
            <circle cx="88" cy="40" r="10" fill="#2d3436"/>
            <path d="M 88,30 L 88,22" stroke="#fdcb6e" stroke-width="3"/>
            <circle cx="88" cy="20" r="3" fill="#e74c3c"/>
        </svg>

        <!-- THỎ NGỌC CỰC CUTE (SỬA LẠI DÁNG) -->
        <svg class="tho-ngoc" viewBox="0 0 120 120">
            <!-- Đuôi -->
            <circle cx="28" cy="85" r="8" fill="#ffffff"/>
            <!-- Đùi/Thân -->
            <ellipse cx="52" cy="85" rx="28" ry="20" fill="#ffffff"/>
            <!-- Cánh tay ôm ngực -->
            <path d="M 60,78 Q 72,82 68,90" stroke="#f1f2f6" stroke-width="5" stroke-linecap="round" fill="none"/>
            <!-- Đầu -->
            <circle cx="70" cy="55" r="20" fill="#ffffff"/>
            <!-- Mắt đen tròn xoe -->
            <circle cx="78" cy="50" r="3" fill="#2d3436"/>
            <circle cx="79" cy="49" r="1" fill="#ffffff"/>
            <!-- Mũi hồng -->
            <polygon points="85,53 87,55 85,56" fill="#ff7675"/>
            <!-- Má hồng -->
            <circle cx="72" cy="58" r="4" fill="#ff7675" opacity="0.35"/>
            <!-- Tai dài ngẩng cao -->
            <ellipse cx="62" cy="22" rx="6" ry="22" fill="#ffffff" transform="rotate(-12 62 22)"/>
            <ellipse cx="62" cy="22" rx="3" ry="15" fill="#ffcaa1" transform="rotate(-12 62 22)"/>
            <ellipse cx="75" cy="20" rx="6" ry="24" fill="#ffffff" transform="rotate(5 75 20)"/>
            <ellipse cx="75" cy="20" rx="3" ry="16" fill="#ffcaa1" transform="rotate(5 75 20)"/>
        </svg>

        <!-- CÂY ĐA SIÊU TO + CUỘI THỔI SÁO -->
        <svg class="tree-and-cuoi" viewBox="0 0 500 550">
            <!-- TÁN CÂY ĐA SIÊU LỚN -->
            <path d="M 150,220 Q 80,100 200,50 Q 300,-10 420,40 Q 520,100 480,220 Q 450,300 350,280 Q 250,320 150,220 Z" fill="#0a1d0d"/>
            <path d="M 180,190 Q 120,80 230,40 Q 320,0 420,50 Q 500,120 450,210 Q 380,260 280,240 Z" fill="#143818"/>
            <path d="M 220,160 Q 170,70 260,30 Q 350,10 430,70 Q 480,130 420,190 Q 340,220 260,200 Z" fill="#1e4d22"/>

            <!-- THÂN CÂY CỔ THỤ NÂU SẦM -->
            <path d="M 330,520 Q 320,380 290,280 Q 260,210 230,170 L 265,165 Q 300,210 325,280 Q 360,390 410,520 Z" fill="#2d1a0e"/>
            <!-- Cành lớn đâm ngang -->
            <path d="M 300,260 Q 230,210 160,190 L 165,178 Q 240,198 310,245 Z" fill="#2d1a0e"/>
            <!-- Rễ đa rủ tua rua -->
            <path d="M 240,180 Q 230,320 220,520" stroke="#1d1008" stroke-width="6" fill="none"/>
            <path d="M 210,190 Q 200,340 190,520" stroke="#1d1008" stroke-width="4" fill="none"/>
            <path d="M 380,280 Q 390,390 400,520" stroke="#1d1008" stroke-width="5" fill="none"/>

            <!-- CHÚ CUỘI THỔI SÁO NGỒI TỰA GỐC ĐA -->
            <g transform="translate(200, 410)">
                <!-- Thân Cuội -->
                <path d="M 30,30 Q 15,40 20,70 L 70,70 Q 65,40 50,30 Z" fill="#7f4f24"/>
                <path d="M 20,65 Q 10,85 30,85 L 60,85 Q 75,85 70,65 Z" fill="#36200d"/>
                <!-- Đầu & Búi tóc -->
                <circle cx="40" cy="20" r="12" fill="#ffeaa7"/>
                <path d="M 30,16 Q 40,6 50,16 Q 50,10 40,8 Q 30,10 30,16 Z" fill="#2d3436"/>
                <circle cx="40" cy="6" r="4.5" fill="#2d3436"/>
                <!-- TAY CẦM SÁO TRÚC GHÉ MÔI THỔI -->
                <line x1="15" y1="28" x2="65" y2="20" stroke="#f1c40f" stroke-width="4" stroke-linecap="round"/> <!-- Cây sáo -->
                <path d="M 25,45 Q 35,26 40,26" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round" fill="none"/> <!-- Tay trái -->
                <path d="M 55,45 Q 48,25 43,25" stroke="#ffeaa7" stroke-width="5" stroke-linecap="round" fill="none"/> <!-- Tay phải -->
                <!-- Rìu tựa bên hông -->
                <line x1="75" y1="35" x2="85" y2="80" stroke="#636e72" stroke-width="4"/>
                <path d="M 70,36 Q 82,28 86,42 Z" fill="#b2bec3"/>
            </g>
        </svg>

        <!-- MẶT ĐẤT -->
        <svg class="ground-svg" viewBox="0 0 1200 160" preserveAspectRatio="none">
            <path d="M 0,60 Q 400,10 800,50 T 1200,20 L 1200,160 L 0,160 Z" fill="#061208"/>
        </svg>
    </div>

</body>
</html>
