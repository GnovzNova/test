<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Cảnh Cây Đa Chú Cuội 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #03030d;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Khung cảnh chính */
        .scene-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background: radial-gradient(circle at 50% 35%, #101540 0%, #03030d 100%);
            overflow: hidden;
        }

        /* 1. Nền Trăng To 2D Tỏa Sáng */
        .bg-big-moon {
            position: absolute;
            top: 12%; left: 50%;
            transform: translateX(-50%);
            width: 320px; height: 320px;
            background: radial-gradient(circle, #ffffff 0%, #fff3a0 40%, #fbc531 75%, transparent 100%);
            border-radius: 50%;
            opacity: 0.85;
            box-shadow: 0 0 60px rgba(251, 197, 49, 0.6), 0 0 120px rgba(255, 243, 160, 0.4);
            pointer-events: none;
            animation: moonGlow 4s ease-in-out infinite alternate;
        }

        @keyframes moonGlow {
            0% { box-shadow: 0 0 50px rgba(251, 197, 49, 0.5), 0 0 100px rgba(255, 243, 160, 0.3); }
            100% { box-shadow: 0 0 80px rgba(251, 197, 49, 0.8), 0 0 150px rgba(255, 243, 160, 0.6); }
        }

        /* 2. Cây Đa & Chú Cuội (Silhouette 2D) */
        .tree-cuoi-container {
            position: absolute;
            bottom: 0; left: 50%;
            transform: translateX(-50%);
            width: 420px; height: 320px;
            pointer-events: none;
            z-index: 2;
        }

        /* 3. Chị Hằng Bay Bồng Bềnh */
        .hang-nga {
            position: absolute;
            top: 18%; right: 18%;
            width: 110px;
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 0 15px #ffeaa7);
            animation: floatHangNga 5s ease-in-out infinite alternate;
        }

        @keyframes floatHangNga {
            0% { transform: translateY(0) rotate(0deg) scale(1); }
            50% { transform: translateY(-20px) rotate(-3deg) scale(1.03); }
            100% { transform: translateY(-35px) rotate(-6deg) scale(1); }
        }

        /* 4. Thỏ Ngọc Nhảy Nhót */
        .rabbit {
            position: absolute;
            bottom: 45px; left: 22%;
            width: 50px;
            z-index: 3;
            pointer-events: none;
            filter: drop-shadow(0 0 10px #ffffff);
            animation: rabbitHop 2.2s ease-in-out infinite;
        }

        @keyframes rabbitHop {
            0%, 100% { transform: translateY(0) scaleY(1); }
            40% { transform: translateY(-25px) scaleY(1.08) scaleX(0.95); }
            50% { transform: translateY(-28px) scaleY(1.1) scaleX(0.9); }
            60% { transform: translateY(-20px) scaleY(0.95) scaleX(1.05); }
            70% { transform: translateY(0) scaleY(0.9) scaleX(1.1); }
        }

        /* Mấy đám mây mờ trôi nhẹ */
        .cloud {
            position: absolute;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50px;
            pointer-events: none;
            filter: blur(8px);
            animation: cloudMove 25s linear infinite;
        }

        .cloud-1 { top: 20%; left: -150px; width: 220px; height: 60px; }
        .cloud-2 { top: 35%; left: -200px; width: 300px; height: 80px; animation-delay: 10s; }

        @keyframes cloudMove {
            0% { transform: translateX(0); }
            100% { transform: translateX(calc(100vw + 350px)); }
        }
    </style>
</head>
<body>

    <div class="scene-container">
        <!-- Đám mây trôi -->
        <div class="cloud cloud-1"></div>
        <div class="cloud cloud-2"></div>

        <!-- Trăng khổng lồ tỏa sáng -->
        <div class="bg-big-moon"></div>

        <!-- Cây Đa & Chú Cuội ngồi thổi sáo dưới gốc cây -->
        <div class="tree-cuoi-container">
            <svg viewBox="0 0 400 300" width="100%" height="100%">
                <!-- Đồi cỏ đằng sau -->
                <path d="M 0 300 Q 200 230 400 300 Z" fill="#060919"/>
                
                <!-- Tán Cây Đa cổ thụ 2D -->
                <circle cx="150" cy="110" r="85" fill="#0a102b"/>
                <circle cx="230" cy="95" r="75" fill="#0d1538"/>
                <circle cx="100" cy="150" r="65" fill="#0a102b"/>
                <circle cx="280" cy="140" r="55" fill="#070c21"/>
                
                <!-- Thân Cây Đa xù xì -->
                <path d="M 170 280 Q 180 180 200 130 Q 150 170 120 280 Z" fill="#060919"/>
                <!-- Rễ cây -->
                <path d="M 120 280 Q 80 285 50 300 L 130 300 Z" fill="#060919"/>
                <path d="M 170 280 Q 220 285 260 300 L 160 300 Z" fill="#060919"/>

                <!-- Bóng Chú Cuội ngồi dựa gốc cây -->
                <!-- Đầu & Búi tóc -->
                <circle cx="205" cy="235" r="9" fill="#ffeaa7"/>
                <circle cx="200" cy="229" r="4" fill="#ffeaa7"/>
                <!-- Dáng ngồi dốc chân -->
                <path d="M 198 244 C 200 255 215 260 225 260 C 220 250 210 245 198 244 Z" fill="#ffeaa7"/>
                <!-- Tay cầm ống sáo -->
                <line x1="205" y1="242" x2="225" y2="238" stroke="#ffeaa7" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>

        <!-- Chị Hằng Nga bay lượn -->
        <div class="hang-nga">
            <svg viewBox="0 0 120 120" width="100%" height="100%">
                <!-- Dải lụa bay -->
                <path d="M 10 70 Q 40 20 90 40 Q 60 90 20 80 Z" fill="rgba(255, 234, 167, 0.45)"/>
                <path d="M 25 85 Q 55 35 105 55" stroke="#ffeaa7" stroke-width="2" fill="none"/>
                <!-- Dáng người Chị Hằng -->
                <circle cx="60" cy="40" r="8" fill="#ffffff"/> <!-- Đầu -->
                <path d="M 55 48 Q 70 70 45 90 Q 40 70 55 48 Z" fill="#ffffff"/> <!-- Váy xòe -->
                <!-- Tóc búi cao -->
                <circle cx="56" cy="33" r="4" fill="#ffffff"/>
            </svg>
        </div>

        <!-- Thỏ Ngọc nhảy tưng tưng -->
        <div class="rabbit">
            <svg viewBox="0 0 60 60" width="100%" height="100%">
                <!-- Thân thỏ -->
                <ellipse cx="28" cy="42" rx="14" ry="11" fill="#ffffff"/>
                <!-- Đầu thỏ -->
                <circle cx="36" cy="26" r="8" fill="#ffffff"/>
                <!-- Tai thỏ -->
                <ellipse cx="33" cy="12" rx="2.5" ry="8" fill="#ffffff" transform="rotate(-10 33 12)"/>
                <ellipse cx="39" cy="13" rx="2.5" ry="8" fill="#ffffff" transform="rotate(10 39 13)"/>
                <!-- Đuôi thỏ tròn -->
                <circle cx="12" cy="42" r="3.5" fill="#ffffff"/>
                <!-- Mắt thỏ hồng -->
                <circle cx="39" cy="25" r="1" fill="#ff7675"/>
            </svg>
        </div>
    </div>

</body>
</html>
