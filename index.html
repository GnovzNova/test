<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Trung Thu 2D Pure SVG 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #030611;
            overflow: hidden;
            width: 100vw; height: 100vh;
            font-family: sans-serif;
        }

        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 30%, #1a233d 0%, #050814 75%);
            overflow: hidden;
        }

        /* TRĂNG RẰM */
        .moon-container {
            position: absolute;
            top: 6%; left: 50%;
            transform: translateX(-50%);
            width: 320px; height: 320px;
            z-index: 1;
        }

        /* MÂY TRÔI */
        .cloud {
            position: absolute;
            z-index: 2;
            animation: floatCloud 14s ease-in-out infinite alternate;
        }
        .cloud-1 { top: 10%; left: 10%; width: 260px; opacity: 0.5; }
        .cloud-2 { top: 22%; right: 8%; width: 300px; opacity: 0.4; animation-delay: -5s; }

        @keyframes floatCloud {
            0% { transform: translateX(-20px); }
            100% { transform: translateX(20px); }
        }

        /* CHỊ HẰNG (SVG PURE) */
        .hang-nga {
            position: absolute;
            top: 14%; right: 22%;
            width: 180px;
            z-index: 3;
            filter: drop-shadow(0 0 12px rgba(255, 234, 167, 0.6));
            animation: hangFly 4s ease-in-out infinite alternate;
        }

        @keyframes hangFly {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(-2deg); }
        }

        /* CÂY ĐA & CHÚ CUỘI */
        .tree-and-cuoi {
            position: absolute;
            bottom: 30px; right: 2%;
            width: 420px;
            z-index: 4;
            filter: drop-shadow(-5px 0 15px rgba(0,0,0,0.7));
        }

        /* THỎ NGỌC */
        .tho-ngoc {
            position: absolute;
            bottom: 45px; left: 18%;
            width: 90px;
            z-index: 5;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.5));
            animation: rabbitHop 2.5s ease-in-out infinite alternate;
        }

        @keyframes rabbitHop {
            0% { transform: translateY(0); }
            100% { transform: translateY(-12px); }
        }

        /* ĐỒI CỎ MẶT ĐẤT */
        .ground-svg {
            position: absolute;
            bottom: 0; left: 0;
            width: 100%; height: 180px;
            z-index: 3;
        }

        /* ĐÈN LỒNG BAY */
        .lantern {
            position: absolute;
            width: 30px;
            z-index: 2;
            animation: lanternRise 12s linear infinite;
        }
        .l1 { left: 15%; bottom: -50px; animation-duration: 14s; }
        .l2 { left: 35%; bottom: -50px; animation-duration: 10s; animation-delay: 3s; }
        .l3 { left: 75%; bottom: -50px; animation-duration: 16s; animation-delay: 1s; }

        @keyframes lanternRise {
            0% { transform: translateY(0) scale(0.8); opacity: 0; }
            20% { opacity: 0.9; }
            80% { opacity: 0.8; }
            100% { transform: translateY(-100vh) scale(1.1); opacity: 0; }
        }
    </style>
</head>
<body>

    <div class="scene">
        <!-- ĐÈN LỒNG KHÍ CẦU VĂN HÓA -->
        <svg class="lantern l1" viewBox="0 0 40 60">
            <rect x="10" y="10" width="20" height="30" rx="5" fill="#e74c3c"/>
            <polygon points="10,10 20,2 30,10" fill="#f1c40f"/>
            <polygon points="10,40 20,48 30,40" fill="#f1c40f"/>
            <line x1="20" y1="48" x2="20" y2="58" stroke="#f1c40f" stroke-width="2"/>
            <circle cx="20" cy="25" r="4" fill="#ffeb3b" filter="drop-shadow(0 0 5px #ffeb3b)"/>
        </svg>
        <svg class="lantern l2" viewBox="0 0 40 60">
            <rect x="10" y="10" width="20" height="30" rx="5" fill="#e67e22"/>
            <polygon points="10,10 20,2 30,10" fill="#f1c40f"/>
            <circle cx="20" cy="25" r="4" fill="#ffeb3b" filter="drop-shadow(0 0 5px #ffeb3b)"/>
        </svg>
        <svg class="lantern l3" viewBox="0 0 40 60">
            <rect x="10" y="10" width="20" height="30" rx="5" fill="#e74c3c"/>
            <circle cx="20" cy="25" r="4" fill="#ffeb3b" filter="drop-shadow(0 0 5px #ffeb3b)"/>
        </svg>

        <!-- TRĂNG RẰM -->
        <div class="moon-container">
            <svg viewBox="0 0 200 200">
                <defs>
                    <radialGradient id="moonGlow" cx="50%" cy="50%" r="50%">
                        <stop offset="0%" stop-color="#ffffff"/>
                        <stop offset="60%" stop-color="#fff3a1"/>
                        <stop offset="90%" stop-color="#fbc531"/>
                        <stop offset="100%" stop-color="#e1b12c"/>
                    </radialGradient>
                </defs>
                <circle cx="100" cy="100" r="85" fill="url(#moonGlow)" filter="drop-shadow(0 0 25px rgba(251, 197, 49, 0.8))"/>
                <!-- Dấu vết bóng trăng cổ điển -->
                <circle cx="70" cy="80" r="18" fill="#f5cd79" opacity="0.25"/>
                <circle cx="120" cy="110" r="25" fill="#f5cd79" opacity="0.2"/>
                <circle cx="130" cy="65" r="12" fill="#f5cd79" opacity="0.2"/>
            </svg>
        </div>

        <!-- MÂY MỜ 2D Á ĐÔNG -->
        <svg class="cloud cloud-1" viewBox="0 0 200 60">
            <path d="M 10,40 Q 30,10 70,20 Q 110,0 150,20 Q 180,10 190,35 Q 200,55 160,55 L 20,55 Q 0,55 10,40 Z" fill="#485460"/>
            <path d="M 15,38 Q 33,12 68,22 Q 105,4 142,22 Q 172,12 182,35 Z" fill="#d2dae2" opacity="0.15"/>
        </svg>
        <svg class="cloud cloud-2" viewBox="0 0 200 60">
            <path d="M 10,40 Q 40,10 80,20 Q 120,5 160,25 Q 190,20 195,50 L 10,50 Z" fill="#1e272e"/>
        </svg>

        <!-- CHỊ HẰNG NGA (PURE SVG VECTOR) -->
        <svg class="hang-nga" viewBox="0 0 200 250">
            <!-- Dải lụa bay -->
            <path d="M 20,100 Q 60,20 120,50 Q 180,80 170,160 Q 160,210 100,220 Q 40,220 30,160" fill="none" stroke="#ff7675" stroke-width="8" stroke-linecap="round" opacity="0.85"/>
            <path d="M 10,110 Q 50,30 115,58 Q 170,90 160,165" fill="none" stroke="#ffeaa7" stroke-width="4" stroke-linecap="round"/>
            
            /* Váy đầm thướt tha */
            <path d="M 75,110 Q 60,160 40,210 Q 90,230 130,200 Q 120,150 105,110 Z" fill="#fd79a8"/>
            <path d="M 82,110 Q 70,160 55,205 Q 90,218 120,195 Q 110,150 100,110 Z" fill="#ffffff" opacity="0.9"/>
            
            /* Áo khoác cổ trang */
            <path d="M 78,80 L 65,115 L 90,120 L 102,115 L 92,80 Z" fill="#fab1a0"/>
            <path d="M 85,80 L 105,115 L 115,100 L 95,80 Z" fill="#ffeaa7"/>

            /* Tay áo rủ */
            <path d="M 70,85 Q 40,110 30,140 Q 55,145 72,115 Z" fill="#fd79a8"/>
            <path d="M 100,85 Q 130,110 145,135 Q 125,140 105,115 Z" fill="#fd79a8"/>

            /* Đầu & Tóc búi Hằng Nga */
            <circle cx="88" cy="62" r="14" fill="#ffeaa7"/> <!-- Mặt -->
            <path d="M 74,58 Q 88,42 102,58 Q 102,48 88,44 Q 74,48 74,58 Z" fill="#2d3436"/> <!-- Tóc mái -->
            <circle cx="88" cy="40" r="10" fill="#2d3436"/> <!-- Búi tóc -->
            <path d="M 88,30 L 88,22" stroke="#fdcb6e" stroke-width="3"/> <!-- Trâm cài -->
            <circle cx="88" cy="20" r="3" fill="#e74c3c"/>

            /* Dải lụa tay */
            <path d="M 30,140 Q 10,180 35,200" fill="none" stroke="#ff7675" stroke-width="6"/>
        </svg>

        <!-- THỎ NGỌC 2D (PURE SVG) -->
        <svg class="tho-ngoc" viewBox="0 0 100 100">
            <!-- Tai thỏ -->
            <ellipse cx="40" cy="25" rx="6" ry="20" fill="#ffffff" transform="rotate(-10 40 25)"/>
            <ellipse cx="40" cy="25" rx="3" ry="14" fill="#ffcaa1" transform="rotate(-10 40 25)"/>
            <ellipse cx="55" cy="22" rx="6" ry="22" fill="#ffffff" transform="rotate(10 55 22)"/>
            <ellipse cx="55" cy="22" rx="3" ry="15" fill="#ffcaa1" transform="rotate(10 55 22)"/>
            <!-- Thân & Đầu -->
            <ellipse cx="50" cy="68" rx="22" ry="18" fill="#ffffff"/>
            <circle cx="48" cy="48" r="16" fill="#ffffff"/>
            <!-- Mắt, mũi, má hồng -->
            <circle cx="42" cy="45" r="2" fill="#2d3436"/>
            <circle cx="54" cy="45" r="2" fill="#2d3436"/>
            <polygon points="47,49 49,49 48,51" fill="#ff7675"/>
            <circle cx="38" cy="50" r="3" fill="#ff7675" opacity="0.4"/>
            <circle cx="58" cy="50" r="3" fill="#ff7675" opacity="0.4"/>
            <!-- Đuôi thỏ -->
            <circle cx="72" cy="68" r="6" fill="#ffffff"/>
            <!-- Đào/Bánh trung thu thỏ ôm -->
            <circle cx="40" cy="65" r="7" fill="#f1c40f"/>
        </svg>

        <!-- CÂY ĐA & CHÚ CUỘI (PURE SVG) -->
        <svg class="tree-and-cuoi" viewBox="0 0 400 400">
            <defs>
                <linearGradient id="trunkGrad" x1="0%" y1="0%" x2="100%" y2="0%">
                    <stop offset="0%" stop-color="#1e1005"/>
                    <stop offset="50%" stop-color="#3d2314"/>
                    <stop offset="100%" stop-color="#120903"/>
                </linearGradient>
            </defs>

            <!-- TÁN CÂY ĐA CỔ THỤ (Nhiều tầng lá) -->
            <path d="M 180,180 Q 130,100 220,70 Q 280,30 350,90 Q 410,140 370,200 Q 320,240 250,220 Q 190,240 180,180 Z" fill="#0d2311"/>
            <path d="M 200,160 Q 160,90 240,60 Q 290,20 360,80 Q 400,130 360,180 Q 300,210 240,190 Z" fill="#1b431e"/>
            <path d="M 230,140 Q 200,80 260,50 Q 310,25 360,70 Q 385,110 350,150 Z" fill="#275b2c"/>

            <!-- RỄ & THÂN CÂY ĐA -->
            <path d="M 280,380 Q 270,280 250,220 Q 230,180 210,160 L 235,155 Q 260,185 280,230 Q 310,300 340,380 Z" fill="url(#trunkGrad)"/>
            <!-- Nhánh cây -->
            <path d="M 260,210 Q 210,170 170,160 L 175,150 Q 215,160 268,195 Z" fill="url(#trunkGrad)"/>
            <path d="M 290,240 Q 340,190 370,170 L 375,178 Q 340,200 295,250 Z" fill="url(#trunkGrad)"/>
            <!-- Rễ phụ rủ xuống (Đặc trưng Cây Đa) -->
            <path d="M 220,165 Q 215,250 210,380" stroke="#2c180b" stroke-width="4" fill="none"/>
            <path d="M 200,160 Q 195,230 190,380" stroke="#2c180b" stroke-width="3" fill="none"/>
            <path d="M 330,200 Q 335,280 340,380" stroke="#2c180b" stroke-width="4" fill="none"/>

            <!-- CHÚ CUỘI NGỒI DƯỚI GỐC CÂY -->
            <g transform="translate(180, 310)">
                <!-- Thân & Áo Nâu Cuội -->
                <path d="M 25,25 Q 10,35 15,60 L 65,60 Q 60,35 45,25 Z" fill="#8d5c2c"/>
                <!-- Quần Lụa Tụi -->
                <path d="M 15,55 Q 5,75 25,75 L 55,75 Q 70,75 65,55 Z" fill="#352312"/>
                <!-- Đầu & Búi Tóc Củ Tỏi -->
                <circle cx="35" cy="15" r="11" fill="#ffeaa7"/>
                <path d="M 25,12 Q 35,2 45,12 Q 45,6 35,4 Q 25,6 25,12 Z" fill="#2d3436"/>
                <circle cx="35" cy="3" r="4" fill="#2d3436"/> <!-- Búi tóc -->
                <!-- Tay ôm gối -->
                <path d="M 20,35 Q 35,48 50,35" stroke="#ffeaa7" stroke-width="6" stroke-linecap="round" fill="none"/>
                <!-- Rìu đốn gỗ tựa bên cạnh -->
                <line x1="62" y1="20" x2="75" y2="70" stroke="#636e72" stroke-width="4"/>
                <path d="M 58,22 Q 68,15 72,28 Z" fill="#b2bec3"/>
            </g>
        </svg>

        <!-- MẶT ĐẤT & ĐỒI CỎ 2D -->
        <svg class="ground-svg" viewBox="0 0 1200 180" preserveAspectRatio="none">
            <path d="M 0,80 Q 300,20 600,60 T 1200,30 L 1200,180 L 0,180 Z" fill="#091309"/>
            <path d="M 0,100 Q 400,50 800,90 T 1200,70 L 1200,180 L 0,180 Z" fill="#050a05"/>
        </svg>
    </div>

</body>
</html>
