<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đêm Rằm Trung Thu 🌕</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #020514;
            overflow: hidden;
            width: 100vw; height: 100vh;
        }

        .scene {
            position: relative;
            width: 100vw; height: 100vh;
            background: radial-gradient(circle at 50% 40%, #1a233a 0%, #050b1a 70%, #020514 100%);
            overflow: hidden;
        }

        /* MẶT TRĂNG */
        .moon-container {
            position: absolute;
            top: 40%; left: 50%;
            transform: translate(-50%, -60%);
            width: 320px; height: 320px;
            border-radius: 50%;
            background: #fff8d6;
            box-shadow: 
                0 0 40px #fff1a0,
                0 0 100px rgba(253, 203, 110, 0.8),
                0 0 180px rgba(253, 203, 110, 0.4);
            z-index: 1;
        }

        /* CHỊ HẰNG */
        .hang-nga-wrapper {
            position: absolute;
            top: 15%; right: 28%;
            z-index: 4;
            filter: drop-shadow(0 0 12px rgba(255, 234, 167, 0.6));
            animation: floatHang 4s ease-in-out infinite alternate;
        }

        @keyframes floatHang {
            0% { transform: translateY(0) rotate(0deg); }
            100% { transform: translateY(-15px) rotate(-3deg); }
        }

        /* CÂY ĐA & CHÚ CUỘI */
        .banyan-tree {
            position: absolute;
            bottom: -10px; right: -30px;
            width: 580px; height: 620px;
            z-index: 5;
        }

        /* THỎ NGỌC */
        .rabbit-wrapper {
            position: absolute;
            bottom: 40px; left: 12%;
            z-index: 6;
            animation: rabbitBounce 2.5s ease-in-out infinite alternate;
        }

        @keyframes rabbitBounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-8px); }
        }

        /* MẶT ĐẤT & MÂY */
        .ground {
            position: absolute;
            bottom: 0; left: 0;
            width: 100vw; height: 110px;
            background: linear-gradient(to top, #020703, #091a0c);
            z-index: 3;
        }

        .cloud-bg {
            position: absolute;
            top: 18%; left: -10%;
            width: 500px; height: 120px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 100px;
            filter: blur(25px);
            z-index: 2;
            animation: moveCloud 25s linear infinite;
        }

        @keyframes moveCloud {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(200vw); }
        }
    </style>
</head>
<body>

    <div class="scene">
        <div class="cloud-bg"></div>

        <!-- TRĂNG -->
        <div class="moon-container"></div>

        <!-- MẶT ĐẤT -->
        <div class="ground"></div>

        <!-- CHỊ HẰNG NGA XINH ĐẸP CỔ PHONG -->
        <div class="hang-nga-wrapper">
            <svg width="180" height="220" viewBox="0 0 180 220">
                <!-- Dải lụa mềm bay lượn -->
                <path d="M 10,130 Q 30,30 90,20 Q 160,10 170,80 Q 180,150 120,190 Q 60,210 20,160" fill="none" stroke="#ff7675" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
                <path d="M 25,140 Q 40,45 95,35 Q 150,25 158,85 Q 165,140 115,178" fill="none" stroke="#ffeaa7" stroke-width="2.5" stroke-linecap="round"/>
                
                <!-- Váy & Thân -->
                <path d="M 75,90 L 35,190 Q 90,205 135,185 L 95,90 Z" fill="#fd79a8"/>
                <path d="M 78,90 L 50,185 Q 88,195 120,182 L 92,90 Z" fill="#ffffff" opacity="0.9"/>
                
                <!-- Áo & Tay áo rộng bay -->
                <path d="M 70,60 L 30,110 Q 55,125 75,95 Z" fill="#e84393"/> <!-- Tay trái -->
                <path d="M 100,60 L 145,105 Q 120,125 95,95 Z" fill="#e84393"/> <!-- Tay phải -->
                <path d="M 72,60 L 65,92 L 105,92 L 98,60 Z" fill="#fab1a0"/> <!-- Thân trên -->
                <path d="M 80,60 L 73,92 L 97,92 L 90,60 Z" fill="#ffffff"/> <!-- Cổ áo -->

                <!-- Đầu & Tóc búi cao -->
                <circle cx="85" cy="46" r="11" fill="#ffeaa7"/>
                <path d="M 74,44 Q 85,34 96,44 Q 96,36 85,32 Q 74,36 74,44 Z" fill="#2d3436"/>
                <ellipse cx="85" cy="28" rx="8" ry="10" fill="#2d3436"/> <!-- Búi tóc -->
                <!-- Trâm cài -->
                <line x1="72" y1="28" x2="98" y2="28" stroke="#fdcb6e" stroke-width="2.5"/>
                <circle cx="98" cy="28" r="3" fill="#e74c3c"/>
            </svg>
        </div>

        <!-- CÂY ĐA SIÊU TO & CHÚ CUỘI THỔI SÁO -->
        <svg class="banyan-tree" viewBox="0 0 580 620">
            <!-- Tán lá -->
            <path d="M 120,240 Q 60,80 200,30 Q 340,-20 480,30 Q 580,100 520,250 Q 480,350 360,320 Q 240,380 120,240 Z" fill="#081c0c"/>
            <path d="M 160,210 Q 110,80 220,40 Q 330,0 450,40 Q 530,110 470,230 Q 390,300 280,280 Q 190,310 160,210 Z" fill="#113317"/>
            <path d="M 200,170 Q 160,80 250,50 Q 340,30 430,70 Q 480,130 430,200 Q 350,240 260,230 Z" fill="#1b4d23"/>

            <!-- Thân cây -->
            <path d="M 360,600 Q 340,420 300,280 Q 260,190 220,160 L 260,155 Q 310,210 345,280 Q 390,420 440,600 Z" fill="#2b1810"/>
            <path d="M 270,250 Q 200,200 130,180 L 135,168 Q 210,188 280,235 Z" fill="#2b1810"/> <!-- Cành phụ -->

            <!-- Rễ rủ -->
            <path d="M 220,180 Q 210,360 200,600" stroke="#1a0e0a" stroke-width="5" fill="none"/>
            <path d="M 180,200 Q 170,380 160,600" stroke="#1a0e0a" stroke-width="3" fill="none"/>
            <path d="M 400,300 Q 410,430 420,600" stroke="#1a0e0a" stroke-width="4" fill="none"/>

            <!-- CHÚ CUỘI TỰA GỐC ĐA THỔI SÁO (XÓA CUỐC) -->
            <g transform="translate(240, 430)">
                <!-- Thân Cuội ngồi vắt chân -->
                <path d="M 35,45 Q 20,55 25,100 L 85,100 Q 80,60 65,45 Z" fill="#7f4f24"/> <!-- Áo nâu -->
                <path d="M 20,90 Q 10,120 40,120 L 75,120 Q 90,120 80,90 Z" fill="#36200d"/> <!-- Quần -->

                <!-- Đầu & Búi tóc -->
                <circle cx="50" cy="28" r="14" fill="#ffeaa7"/> <!-- Mặt -->
                <path d="M 38,24 Q 50,12 62,24 Q 62,16 50,14 Q 38,16 38,24 Z" fill="#2d3436"/> <!-- Tóc -->
                <circle cx="50" cy="10" r="5" fill="#2d3436"/> <!-- Búi tóc -->

                <!-- CÂY SÁO TRÚC GHÉ SÁT MÔI -->
                <line x1="10" y1="36" x2="90" y2="28" stroke="#f1c40f" stroke-width="5" stroke-linecap="round"/>
                <!-- Hai cánh tay nâng sáo lên miệng -->
                <path d="M 30,65 Q 42,38 48,36" stroke="#ffeaa7" stroke-width="6" stroke-linecap="round" fill="none"/>
                <path d="M 70,65 Q 58,38 52,36" stroke="#ffeaa7" stroke-width="6" stroke-linecap="round" fill="none"/>
            </g>
        </svg>

        <!-- THỎ NGỌC CUTE -->
        <div class="rabbit-wrapper">
            <svg width="100" height="110" viewBox="0 0 100 110">
                <circle cx="20" cy="80" r="7" fill="#ffffff"/>
                <ellipse cx="45" cy="78" rx="25" ry="18" fill="#ffffff"/>
                <circle cx="62" cy="50" r="18" fill="#ffffff"/>
                <circle cx="70" cy="46" r="2.5" fill="#2d3436"/>
                <circle cx="71" cy="45" r="0.8" fill="#ffffff"/>
                <circle cx="77" cy="50" r="1.5" fill="#ff7675"/>
                <circle cx="65" cy="54" r="3.5" fill="#ff7675" opacity="0.3"/>
                <path d="M 55,70 C 65,72 65,80 60,82" stroke="#e0e0e0" stroke-width="4" stroke-linecap="round" fill="none"/>
                <ellipse cx="54" cy="20" rx="5" ry="18" fill="#ffffff" transform="rotate(-10 54 20)"/>
                <ellipse cx="54" cy="20" rx="2.5" ry="12" fill="#ffcaa1" transform="rotate(-10 54 20)"/>
                <ellipse cx="66" cy="18" rx="5" ry="19" fill="#ffffff" transform="rotate(8 66 18)"/>
                <ellipse cx="66" cy="18" rx="2.5" ry="13" fill="#ffcaa1" transform="rotate(8 66 18)"/>
            </svg>
        </div>
    </div>

</body>
</html>
